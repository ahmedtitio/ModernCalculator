name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'  # تشغيل عند إنشاء وسم جديد يبدأ بـ v (مثل v1.0.0)
  workflow_dispatch:  # السماح بالتشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد JDK (Java Development Kit)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. منح صلاحيات التنفيذ لـ Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء ملفات APK و AAB
      - name: Build with Gradle
        run: ./gradlew clean assembleRelease bundleRelease

      # 5. إنشاء إصدار جديد على GitHub مع رفع الملفات
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. رفع الملفات حتى في حالة التشغيل اليدوي (بدون إنشاء إصدار تلقائي)
      - name: Upload APK and AAB as artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release-files
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
