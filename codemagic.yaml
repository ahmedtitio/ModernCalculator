workflows:
  android-workflow:
    name: بناء تطبيق آلة حديثة
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: com.example.moderncalculator
        MODULE_NAME: app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: إعداد Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          chmod +x ./gradlew || echo "gradlew not found, creating..."
          if [ ! -f "./gradlew" ]; then
            wget https://raw.githubusercontent.com/gradle/gradle/master/gradlew -O gradlew
            chmod +x gradlew
          fi
          if [ ! -d "gradle/wrapper" ]; then
            mkdir -p gradle/wrapper
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            wget https://github.com/gradle/gradle/raw/v7.4.2/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          fi
      - name: بناء APK و AAB
        script: |
          #!/usr/bin/env bash
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease
    artifacts:
      - $MODULE_NAME/build/outputs/**/*.apk
      - $MODULE_NAME/build/outputs/**/*.aab
      - $MODULE_NAME/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true