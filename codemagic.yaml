workflows:
  android-workflow:
    name: بناء تطبيق آلة حديثة
    max_build_duration: 30
    working_directory: ModernCalculator
    environment:
      vars:
        MODULE_NAME: app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: إعداد Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          echo "جاري التحقق من Gradle Wrapper..."
          
          if [ ! -f "./gradlew" ]; then
            echo "جاري توليد Gradle Wrapper جديد..."
            gradle wrapper --gradle-version 8.0 --distribution-type bin
          fi
          
          echo "منح صلاحيات التنفيذ..."
          chmod +x ./gradlew
          
          echo "التحقق من وجود الملفات..."
          ls -la gradle/wrapper/
          ls -la gradlew
          
      - name: بناء APK و AAB
        script: |
          #!/usr/bin/env bash
          echo "بدء عملية البناء..."
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          
    artifacts:
      - ModernCalculator/app/build/outputs/**/*.apk
      - ModernCalculator/app/build/outputs/**/*.aab
      - ModernCalculator/app/build/outputs/**/mapping.txt
    
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true