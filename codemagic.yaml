workflows:
  android-workflow:
    name: بناء تطبيق آلة حديثة
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: com.example.moderncalculator
        MODULE_NAME: app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: تثبيت Gradle Wrapper
        script: |
          # تحميل ملف gradle-wrapper.jar مباشرة إذا كان مفقوداً
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "تحميل Gradle Wrapper..."
            mkdir -p gradle/wrapper
            curl -L "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" --output gradle/wrapper/gradle-wrapper.jar
          fi

          # إنشاء سكريبت gradlew إذا كان مفقوداً
          if [ ! -f "gradlew" ]; then
            echo "إنشاء سكريبت gradlew..."
            cat > gradlew << 'EOF'
#!/bin/sh
exec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
EOF
            chmod +x gradlew
          fi
      
      - name: بناء APK و AAB
        script: |
          echo "بدء عملية البناء..."
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease
          
    artifacts:
      - $MODULE_NAME/build/outputs/**/*.apk
      - $MODULE_NAME/build/outputs/**/*.aab
      - $MODULE_NAME/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true