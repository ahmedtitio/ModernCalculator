workflows:
  starjump-apk:
    name: بناء لعبة قفزة النجوم - APK فقط
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        MODULE_NAME: app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: إعداد Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          set -e
          cd StarJump
          chmod +x ./gradlew
          ls -la gradle/wrapper/
          ls -la gradlew

      - name: بناء APK
        script: |
          #!/usr/bin/env bash
          set -e
          cd StarJump
          echo "بدء عملية البناء..."
          ./gradlew clean assembleRelease --stacktrace
          echo "===== ملفات الإخراج ====="
          find . -name "*.apk" -type f

      - name: نسخ الـ APK لمجلد واضح
        script: |
          #!/usr/bin/env bash
          mkdir -p $CM_BUILD_DIR/build-output
          cp StarJump/app/build/outputs/apk/release/app-release.apk $CM_BUILD_DIR/build-output/StarJump-v1.0.apk || {
            echo "بحث عن أي apk:"
            find $CM_BUILD_DIR -name "*.apk" -exec cp {} $CM_BUILD_DIR/build-output/StarJump.apk \;
          }
          ls -la $CM_BUILD_DIR/build-output/

    artifacts:
      - build-output/*.apk
      - StarJump/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - ahmedtitio@gmail.com
        notify:
          success: true
          failure: true
