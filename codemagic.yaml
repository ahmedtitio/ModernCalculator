workflows:
  android-workflow:
    name: بناء تطبيق آلة حديثة
    max_build_duration: 30
    environment:
      vars:
        MODULE_NAME: app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: إصلاح وتوليد Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          echo "جاري تنظيف ملفات Gradle التالفة..."
          rm -rf gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          
          echo "جاري توليد Gradle Wrapper جديد..."
          # استخدام gradle المثبت في النظام لتوليد الملفات الضرورية
          gradle wrapper --gradle-version 8.0 --distribution-type bin
          
          echo "منح صلاحيات التنفيذ..."
          chmod +x ./gradlew
          
          echo "التحقق من وجود الملفات..."
          ls -la gradle/wrapper/
          ls -la gradlew
          
      - name: بناء APK و AAB
        script: |
          #!/usr/bin/env bash
          echo "بدء عملية البناء..."
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease
          
    artifacts:
      - $MODULE_NAME/build/outputs/**/*.apk
      - $MODULE_NAME/build/outputs/**/*.aab
      - $MODULE_NAME/build/outputs/**/mapping.txt
    
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true