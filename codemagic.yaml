workflows:
  android-workflow:
    name: بناء لعبة قفزة النجوم
    max_build_duration: 30
    working_directory: StarJump
    environment:
      vars:
        MODULE_NAME: app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: إعداد Gradle Wrapper
        script: |
          #!/usr/bin/env bash
          echo "جاري التحقق من Gradle Wrapper..."
          chmod +x ./gradlew
          ls -la gradle/wrapper/
          ls -la gradlew

      - name: بناء APK فقط
        script: |
          #!/usr/bin/env bash
          echo "بدء عملية البناء..."
          ./gradlew clean assembleRelease --stacktrace
          echo "ملفات الإخراج:"
          find app/build/outputs -name "*.apk" || true

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - ahmedtitio@gmail.com
        notify:
          success: true
          failure: true
