workflows:
  android-workflow:
    name: بناء تطبيق آلة حديثة
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: com.example.moderncalculator
        MODULE_NAME: app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: تثبيت وتجهيز Gradle Wrapper
        script: |
          # إذا لم يوجد ملف gradlew، نقوم بتنزيله وتوليده
          if [ ! -f ./gradlew ]; then
            echo "تحميل Gradle Wrapper..."
            wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew -O gradlew
            chmod +x gradlew
          fi
          chmod +x ./gradlew
          
      - name: بناء APK و AAB
        script: |
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease
    artifacts:
      - $MODULE_NAME/build/outputs/**/*.apk
      - $MODULE_NAME/build/outputs/**/*.aab
      - $MODULE_NAME/build/outputs/**/*.txt